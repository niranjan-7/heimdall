appId: com.heimdall.vlc
productName: Heimdall
directories:
  buildResources: build
  output: dist
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,$npm_package_name.env}"
  - "!node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!node_modules/*.d.ts"
  - "!node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,vbproj,sln,xproj}"
  - "!{.editorconfig,.git,.gitignore,.gitattributes}"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: Heimdall
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Heimdall
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.video
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: "Heimdall ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  maintainer: "Heimdall <neeru.gojou@gmail.com>"
  category: Video;AudioVideo;Player;
  executableName: heimdall
  synopsis: VLC and mpv Watch-History & Automated Subtitle Companion
  description: All-seeing media companion with real-time telemetry, AniList auto-scrobbling, and audio-to-speech subtitle auto-sync.
