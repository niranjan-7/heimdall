appId: com.heimdall.vlc
productName: Heimdall
directories:
  buildResources: build
  output: dist
# Only the built app goes into app.asar. Production dependencies are added automatically.
files:
  - out/**/*
  - package.json
# Copied next to the asar: the ffmpeg for this platform (see scripts/fetch-binaries.mjs) and
# the licence notices.
extraResources:
  - from: resources/bin/${os}-${arch}
    to: bin
  - from: resources/shaders
    to: shaders
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
# Release file names have no spaces, so GitHub keeps them as written and electron-updater's
# download URLs match.
publish:
  provider: github
  owner: niranjan-7
  repo: heimdall
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: Heimdall
  signAndEditExecutable: false
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Heimdall
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
mac:
  # One app that runs natively on both Apple Silicon and Intel.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  icon: build/icon.icns
  category: public.app-category.video
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: "Heimdall ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  maintainer: "Heimdall <neeru.gojou@gmail.com>"
  category: Video;AudioVideo;Player;
  executableName: heimdall
  synopsis: Tracks your local anime, shows and movies in VLC and mpv
  description: A desktop companion for VLC and mpv. Remembers where you stopped, syncs progress to AniList, finds subtitles and gives you a phone remote.
