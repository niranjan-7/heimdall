name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run the same checks before building installers.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: skips downloading the Electron binary and rebuilding native
      # modules; none of the checks below need them.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx electron-vite build

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Also a canary: fails if a pinned download disappears or its checksum changes.
      - name: Fetch bundled ffmpeg for this OS
        run: node scripts/fetch-binaries.mjs --host

      # HEIMDALL_FFMPEG_TESTS runs the tests that use the real ffmpeg (subtitle sync end to end).
      - name: Unit tests
        run: npm test
        env:
          HEIMDALL_FFMPEG_TESTS: '1'
